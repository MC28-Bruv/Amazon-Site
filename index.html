<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Cosmicube</title>
<link rel="stylesheet" href="https://amazon.mc28.net/style.css">
</head>
<body>

<header>
  <div class="logo-text">Amazon</div>
</header>

<div class="panel">
    SKIN
</div>
<div class="shop-section">
  <div class="box">
    <div class="box-img">
        <img src="items/elp.png" alt="Purple">
    </div>
    <div class="box-content">
      <div class="product-title">Purple</div>
      <div class="price-row">
        <span class="current-price">$2.50</span>
      </div>
    </div>
  </div>
  <div class="box">
    <div class="box-img">
        <img src="items/picoimp.png" alt="Impostor Pico">
    </div>
    <div class="box-content">
      <div class="product-title">Impostor Pico</div>
      <div class="price-row">
        <span class="current-price">$3.25</span>
      </div>
    </div>
  </div>
</div>

<div class="foot-panel1">
  <div class="box-content">Home</div>
  <div class="box-content">Categories</div>
  <div class="box-content">You</div>
  <div class="box-content">Cart</div>
</div>

</body>
</html>
