<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Cosmicube</title>
<link rel="stylesheet" href="https://amazon.mc28.net/style.css">
</head>
<body>

<header class="panel">
  <div class="logo-text">Amazon</div>
  <a href="builds/amazonv1.zip" download="amazon.zip" class="download-text">Download Amazon</a>
</header>

<div class="panel">
    SKINS
</div>
<div class="shop-section">
  <div class="box">
    <div class="box-img">
        <img src="items/elp.png" alt="Purple">
    </div>
    <div class="box-content">
      <div class="product-title">Purple</div>
      <div class="price-row">
        <span class="current-price">$2.50</span>
      </div>
    </div>
  </div>
  <div class="box">
    <div class="box-img">
        <img src="items/picoimp.png" alt="Impostor Pico">
    </div>
    <div class="box-content">
      <div class="product-title">Impostor Pico</div>
      <div class="price-row">
        <span class="current-price">$3.25</span>
      </div>
    </div>
  </div>
</div>

<div class="panel">
    PETS
</div>
<div class="shop-section">
  <div class="box">
    <div class="box-img">
        <img src="items/evillooksie.png" alt="Evil Looksie">
    </div>
    <div class="box-content">
      <div class="product-title">Evil Looksie</div>
      <div class="price-row">
        <span class="current-price">$3.75</span>
      </div>
    </div>
  </div>
  <div class="box">
    <div class="box-img">
        <img src="items/pinkparasite.png" alt="Pink Parasite">
    </div>
    <div class="box-content">
      <div class="product-title">Pink Parasite</div>
      <div class="price-row">
        <span class="current-price">$3.75</span>
      </div>
    </div>
  </div>
</div>


</body>
</html>
